name: Snyk Security Scan

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 9 * * 1' # Weekly Monday 9am UTC

permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        id: snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      # Upload only a scan that actually wrote results. A 401 leaves no SARIF;
      # uploading that missing path hides the auth error behind a second failure.
      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

      - name: Fail when Snyk produced no scan result
        if: always() && hashFiles('snyk.sarif') == ''
        run: |
          echo "Snyk did not write snyk.sarif, so this run has no scan result to upload."
          echo "If the Snyk step logged 401 SNYK-0005, SNYK_TOKEN is missing or rejected."
          echo "A repository admin needs to replace that secret. This workflow does not read or change secrets."
          exit 1
